<!DOCTYPE html>
<html lang="zh-CN" class="welcome-blocking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      welcome-blocking: 首次加载时立即展示深色遮罩，防止白屏闪烁。
      Vue 挂载后由 Layout.vue / WelcomeOverlay.vue 移除该 class。
    -->
    <style>
      html.welcome-blocking::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #0d1321;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/@vitepress/client/app.js"></script>
  </body>
</html>
