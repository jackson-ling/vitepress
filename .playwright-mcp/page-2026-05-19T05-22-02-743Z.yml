        - paragraph [ref=e620]:
          - text: 非递归遍历就是使
          - strong [ref=e621]: 用栈模拟递归
          - text: 的过程，首先明确栈的特点：
          - strong [ref=e622]: 后进先出
          - text: ，也就是有
          - strong [ref=e623]: 逆序的特点
        - paragraph [ref=e624]:
          - strong [ref=e625]: 举例
        - blockquote [ref=e626]:
          - paragraph [ref=e627]: 假设需要得到前序遍历顺序：1（根）2（左）3（右）
          - list [ref=e628]:
            - listitem [ref=e629]:
              - text: 首先让
              - strong [ref=e630]: 1（根）
              - text: 入栈，之后
              - strong [ref=e631]: 出栈
              - text: ，记录遍历顺序
            - listitem [ref=e632]:
              - text: 然后让
              - strong [ref=e633]: 3（右）
              - text: 入栈、
              - strong [ref=e634]:
                - text: 2（左）
                - strong [ref=e635]: 入栈，此时栈顶元素就是
                - text: 2（左）
              - text: ，依次出栈，就可以得到
              - strong [ref=e636]: 1（根）2（左）3（右）
        - heading "结论：使用迭代法模拟前序的递归遍历时，左右孩子在栈操作中的遍历和处理顺序应该颠倒" [level=4] [ref=e637]
        - paragraph [ref=e638]:
          - strong [ref=e639]: 栈处理顺序如下
        - list [ref=e640]:
          - listitem [ref=e641]: 首先将根节点入栈
          - listitem [ref=e642]: 先让右孩子入栈
          - listitem [ref=e643]: 后让左孩子入栈
        - paragraph [ref=e644]: 解释：因为栈的特点是后进先出，入栈元素顺序和出栈元素顺序相反
        - paragraph [ref=e645]:
          - strong [ref=e646]: 特点
        - list [ref=e647]:
          - listitem [ref=e648]: 入栈：体现元素的遍历
          - listitem [ref=e649]: 出栈：体现元素的处理
          - listitem [ref=e650]: 对象：都是栈
        - generic [ref=e651]:
