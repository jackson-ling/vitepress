            - generic [ref=e656]: "class Solution{"
            - generic [ref=e657]: "public List<Integer> preorderTraversal(TreeNode root) {"
            - generic [ref=e658]: List<Integer> result = new ArrayList<>();
            - generic [ref=e659]: "if (root == null) {"
            - generic [ref=e660]: return result;
            - generic [ref=e661]: "}"
            - generic [ref=e662]: Stack<TreeNode> stack = new Stack<>();
            - generic [ref=e663]: stack.push(root); // 根节点入栈
            - generic [ref=e664]: "while (!stack.isEmpty()) {"
            - generic [ref=e665]: // 处理根节点，同时把遍历顺序记录在数组中
            - generic [ref=e666]: TreeNode node = stack.pop();
            - generic [ref=e667]: result.add(node.val);
            - generic [ref=e668]: // 先处理右孩子
            - generic [ref=e669]: "if (node.right != null) {"
            - generic [ref=e670]: stack.push(node.right);
            - generic [ref=e671]: "}"
            - generic [ref=e672]: // 后处理左孩子
            - generic [ref=e673]: "if (node.left != null) {"
            - generic [ref=e674]: stack.push(node.left);
            - generic [ref=e675]: "}"
            - generic [ref=e676]: "}"
            - generic [ref=e677]: return result;
            - generic [ref=e678]: "}"
            - generic [ref=e679]: "}"
